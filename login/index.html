<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    
    <form>
            <h1>Login</h1>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="Digite seu email" required>
        </div>

        <div>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="Digite sua senha" required>
        </div>

        <button type="submit">Entrar</button>

        <a href="../Cadastro/">Ainda não tem uma conta? Cadastre-se</a>
        <p id="message" role="status"></p>
    </form>

    <script src="../script.js"></script>
    <script src="../notificacoes.js"></script>
    <script src="./login.js"></script>

</body>
</html>
