<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mensagens - FrontD</title>

    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="../comunidade.css">

    <link rel="stylesheet" href="../navegacao.css">
</head>

<body>

    <header class="topo">

        <a class="logo" href="../Blog/index.html">
            Front<span>D</span>
        </a>

        <nav class="menu">

            <a href="../Blog/index.html">Início</a>
            <a href="../descobrir/index.html">Descobrir</a>
            <a href="../campanhas/index.html">Campanhas</a>

            <a class="ativo" href="index.html">
                Mensagens
            </a>

            <a href="../comunidades/index.html">
                Comunidades
            </a>

            <a href="../perfil/index.html">
                Meu perfil
            </a>

        </nav>

    </header>


    <main class="pagina">

        <div class="titulo-pagina">

            <small>CONVERSAS</small>

            <h1>Mensagens</h1>

        </div>


        <section class="mensagens-layout">

            <aside class="painel-contatos">
                <a class="nova-conversa" href="../descobrir/index.html"><i data-lucide="user-plus"></i> Encontrar jogador</a>
                <label class="busca-contatos" for="buscarContato">Buscar contatos</label>
                <input id="buscarContato" type="search" placeholder="Nome do jogador...">
                <nav class="filtros-contatos" aria-label="Filtrar contatos">
                    <button type="button" data-filtro="todos" aria-pressed="true">Todos</button>
                    <button type="button" data-filtro="amigos" aria-pressed="false">Amigos</button>
                    <button type="button" data-filtro="comunidade" aria-pressed="false">Comunidades</button>
                </nav>
                <div id="contatos" class="contatos"></div>
                <a class="contatos-comunidades" href="../comunidades/index.html">Explorar comunidades</a>
            </aside>


            <section class="chat">

                <header class="chat-cabecalho">
                    <h3 id="nomeContato">Mensagens diretas</h3>
                    <p id="detalheContato"></p>
                </header>

                <div
                    id="chat"
                    class="chat-mensagens"
                ><div class="chat-vazio"><i data-lucide="messages-square"></i><h2>A próxima aventura começa com uma conversa.</h2><p>Seus amigos e companheiros de comunidade estão ao lado.</p><a class="botao" href="../descobrir/index.html">Encontrar jogador</a></div></div>

                <div class="enviar-mensagem">

                    <input
                        id="mensagem"
                        placeholder="Digite uma mensagem..."
                        aria-label="Mensagem"
                        maxlength="5000"
                    >

                    <button
                        id="enviar"
                        class="botao"
                    >
                        Enviar
                    </button>

                </div>

            </section>

        </section>

    </main>


    <script src="../script.js"></script>
    <script src="../notificacoes.js"></script>
    <script src="../navegacao.js"></script>
    <script src="script.js"></script>

</body>

</html>
