<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil - FrontD</title>

    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="../comunidade.css">
    <link rel="stylesheet" href="perfil.css">

    <link rel="stylesheet" href="../navegacao.css">
</head>

<body>

    <header class="topo">

        <a
            class="logo"
            href="../Blog/index.html"
        >
            Front<span>D</span>
        </a>

        <nav class="menu">

            <a href="../Blog/index.html">Início</a>

            <a href="../descobrir/index.html">
                Descobrir
            </a>

            <a href="../campanhas/index.html">
                Campanhas
            </a>

            <a href="../mensagens/index.html">
                Mensagens
            </a>

            <a href="../comunidades/index.html">
                Comunidades
            </a>

            <a href="index.html" class="ativo">
                Meu perfil
            </a>

        </nav>

    </header>


    <main class="pagina">

        <div class="titulo-pagina">

            <small>AVENTUREIRO</small>

            <h1>Perfil</h1>

        </div>


        <section class="card">

            <div class="perfil-grande">

                <img
                    id="avatarPerfil"
                    alt="Avatar"
                >

                <div>

                    <h2 id="nomePerfil">
                        Carregando...
                    </h2>

                    <p id="emailPerfil"></p>

                    <p id="bioPerfil"></p>

                    <div
                        id="tagsPerfil"
                        class="tags"
                        style="margin-top:12px"
                    ></div>

                </div>

            </div>

            <div
                id="acoesPerfil"
                style="margin-top:20px"
            ></div>

            <button id="abrirEdicao" class="botao" type="button" aria-controls="editarPerfil" aria-expanded="false" hidden>Editar perfil</button>
        </section>


        <section
            id="editarPerfil"
            class="card"
            hidden
        >

            <h2>Editar perfil</h2>

            <form
                id="formPerfil"
                class="formulario"
            >

                <div class="campo">

                    <label>Nome</label>

                    <input
                        id="nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label>Biografia</label>

                    <textarea
                        id="biografia"
                    ></textarea>

                </div>

                <div class="campo">
                    <label for="privacidadePerfil">Privacidade da conta</label>
                    <select id="privacidadePerfil">
                        <option value="publico">Pública</option>
                        <option value="privado">Privada</option>
                    </select>
                </div>


                <div class="campo">

                    <label>Escolha um avatar</label>

                    <div
                        id="avatarOpcoes"
                        class="avatar-opcoes"
                    ></div>

                </div>


                <button class="botao">
                    Salvar perfil
                </button>
                <button id="cancelarEdicao" class="botao-secundario" type="button">Cancelar</button>

                <p
                    id="mensagemPerfil"
                    class="mensagem"
                ></p>

            </form>

        </section>


        <section id="solicitacoesCard" class="card" hidden>
            <h2>Seguidores e solicitações</h2>
            <div id="solicitacoesPerfil" class="lista"></div>
        </section>

        <section id="perfilPrivadoAviso" class="card" hidden>
            <h2>Perfil privado</h2>
            <p>Envie uma solicitação para ver as publicações, os sistemas e as campanhas deste jogador.</p>
        </section>

        <section
            id="sistemasCard"
            class="card"
        >

            <h2>Sistemas de RPG</h2>

            <div
                id="adicionarSistemaArea"
                class="comentar"
                hidden
            >

                <input
                    id="nomeSistema"
                    placeholder="Ex: D&D 5e"
                >

                <button
                    id="adicionarSistema"
                    class="botao"
                >
                    Adicionar
                </button>

            </div>

            <div
                id="sistemas"
                class="tags"
                style="margin-top:15px"
            ></div>

        </section>


        <section id="campanhasCard" class="card">
            <h2>Campanhas criadas</h2>
            <div id="campanhasPerfil" class="lista"></div>
        </section>

        <section class="card">

            <h2>Publicações</h2>

            <div
                id="postsPerfil"
                class="lista"
            ></div>

        </section>

    </main>


    <script src="../script.js"></script>
    <script src="../notificacoes.js"></script>
    <script src="../navegacao.js"></script>
    <script src="perfil.js"></script>

</body>

</html>
