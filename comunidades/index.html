<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Comunidades - FrontD</title>

    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="../comunidade.css">

    <link rel="stylesheet" href="../navegacao.css">
</head>

<body>

    <header class="topo">

        <a class="logo" href="../Blog/index.html">
            Front<span>D</span>
        </a>

        <nav class="menu">

            <a href="../Blog/index.html">Início</a>
            <a href="../descobrir/index.html">Descobrir</a>
            <a href="../campanhas/index.html">Campanhas</a>
            <a href="../mensagens/index.html">Mensagens</a>

            <a class="ativo" href="index.html">
                Comunidades
            </a>

            <a href="../perfil/index.html">
                Meu perfil
            </a>

        </nav>

    </header>


    <main class="pagina">

        <div class="titulo-pagina">

            <small>GRUPOS</small>

            <h1>Comunidades</h1>

            <p>
                Crie espaços para conversar sobre seus sistemas favoritos.
            </p>

        </div>


        <section class="card">

            <h2>Criar comunidade</h2>

            <form
                id="formComunidade"
                class="formulario"
            >

                <div class="campo">

                    <label>Nome</label>

                    <input
                        id="nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label>Descrição</label>

                    <textarea
                        id="descricao"
                        required
                    ></textarea>

                </div>


                <button class="botao">
                    Criar comunidade
                </button>

            </form>

        </section>


        <section class="card">

            <h2>Comunidades</h2>

            <div
                id="comunidades"
                class="grid"
            ></div>

        </section>

    </main>


    <script src="../script.js"></script>
    <script src="../notificacoes.js"></script>
    <script src="../navegacao.js"></script>
    <script src="script.js"></script>

</body>

</html>
