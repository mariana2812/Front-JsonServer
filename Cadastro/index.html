<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="./home.css">
</head>
<body>
    <h1>Cadastro</h1>
    <form>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="Digite seu email" required>
        </div>

        <div>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password" placeholder="Digite sua senha" required>
        </div>

        <button type="submit">Cadastrar</button>
        <a href="../Login/">Já possui uma conta? Entre</a>
        <p id="message" role="status"></p>

    </form>

    <script src="../script.js"></script>
    <script src="./home.js"></script>
</body>
</html>
